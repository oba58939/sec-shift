<h2>シフト入力</h2>
<form (ngSubmit)="addShift()">
  <label for="employeeName">従業員名:</label>
  <input id="employeeName" [(ngModel)]="shift.employeeName" name="employeeName" required>

  <label for="role">役割:</label>
  <input id="role" [(ngModel)]="shift.role" name="role" required>

  <label for="startTime">開始時間:</label>
  <input id="startTime" type="datetime-local" [(ngModel)]="shift.startTime" name="startTime" required>

  <label for="endTime">終了時間:</label>
  <input id="endTime" type="datetime-local" [(ngModel)]="shift.endTime" name="endTime" required>

  <label for="breakTime">休憩時間（分）:</label>
  <input id="breakTime" type="number" [(ngModel)]="shift.breakTime" name="breakTime" required>

  <label for="storeLocation">店舗名:</label>
  <input id="storeLocation" [(ngModel)]="shift.storeLocation" name="storeLocation" required>

  <label for="status">状態:</label>
  <select id="status" [(ngModel)]="shift.status" name="status">
    <option value="仮">仮</option>
    <option value="確定">確定</option>
    <option value="キャンセル">キャンセル</option>
  </select>

  <button type="submit">シフトを保存</button>
</form>
